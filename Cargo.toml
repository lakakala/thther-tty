[package]
name = "thther"
version = "0.1.3"
edition = "2021"
description = "TCP-based mosh-like persistent remote terminal with SSH bootstrap and detach/attach"
license = "MIT"
repository = "https://github.com/lakakala/thther-tty"
readme = "README.md"
keywords = ["terminal", "ssh", "mosh", "remote"]
categories = ["command-line-utilities"]

[[bin]]
name = "thther"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
portable-pty = "0.8"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
hex = "0.4"
serde_json = "1"

[profile.release]
lto = true
strip = true
