name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload, e.g. v0.1.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in AlmaLinux 8 (glibc 2.28) so the binary
          # also runs on older servers such as RHEL 8.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            container: almalinux:8
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            container: almalinux:8
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Install build tools
        if: runner.os == 'Linux'
        run: dnf install -y gcc binutils git tar gzip curl ca-certificates libstdc++ && dnf clean all

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Clients auto-install the server binary from releases/v<Cargo version>,
      # so the tag must match Cargo.toml exactly.
      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os == 'Linux' && format('almalinux-8-{0}', matrix.target) || matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="thther-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/thther" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            thther-*.tar.gz
            thther-*.tar.gz.sha256
